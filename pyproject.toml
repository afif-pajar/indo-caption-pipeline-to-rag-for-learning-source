[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "indo-caption-pipeline"
version = "0.1.0"
description = "Local-first Indonesian caption generation for authorized learning sources"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Afif Pajar" }]
dependencies = [
  "faster-whisper==1.2.1",
  "yt-dlp==2026.10.21",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
indo-caption = "indo_caption_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indo_caption_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
